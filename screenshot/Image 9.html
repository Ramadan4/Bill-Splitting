<style>

<body class="bg-background text-on-background min-h-screen pb-[100px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding py-sm w-full bg-background dark:bg-background docked full-width top-0">
<button class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-100 p-2">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed-dim md:font-display-lg md:text-display-lg font-bold">SplitEat</h1>
<button class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-100 p-2">
<span class="material-symbols-outlined" data-icon="translate">translate</span>
</button>
</header>
<main class="px-container-padding pt-md pb-xl">
<!-- Hero / Header Section -->
<div class="flex flex-col items-center justify-center text-center mb-xl mt-lg">
<img alt="SplitEat Logo" class="w-24 h-24 mb-md rounded-xl shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwC3EE5Kef4anrdy3DAeLXfPyA2REiw79WqDglwM5jkI-nGWAeVgPNrzp7u7Fmj3gyt-v56prd5ORO7q83LN9gF8kiZ0sDTuVLNzoW8k_mtjjgM3tJSNIE0Ug4CNtL0-dMTG3CMoYRs7axhZ5_ofdtJqLS75liiLsdQ0ZHWlp53vEHX1epSIBFjyFyQIaw0Cf8OkIq8US1U3j8SaUuE3fy8UQvuHVue_a5fyNky-dTDmuiK_oOL1rZyA"/>
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-background mb-xs">قسّم الفاتورة بعدل</h2>
<p class="font-arabic-body text-arabic-body text-on-surface-variant max-w-sm">طريقة سهلة وسريعة لتقسيم فواتير المطاعم والمقاهي بين الأصدقاء بدون إحراج.</p>
</div>
<!-- Bento Grid -->
<div class="grid grid-cols-2 gap-bento-gap mb-xl">
<!-- Card 1: Bill History -->
<button class="bg-surface-container-low rounded-xl p-lg flex flex-col items-center justify-center gap-sm shadow-sm hover:shadow-md transition-shadow active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container mb-xs">
<span class="material-symbols-outlined" data-icon="receipt_long" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">سجل الفواتير</span>
<span class="font-body-sm text-body-sm text-on-surface-variant text-center">راجع فواتيرك السابقة</span>
</button>
<!-- Card 2: Friends Groups -->
<button class="bg-surface-container-low rounded-xl p-lg flex flex-col items-center justify-center gap-sm shadow-sm hover:shadow-md transition-shadow active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary mb-xs">
<span class="material-symbols-outlined" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">مجموعات الأصدقاء</span>
<span class="font-body-sm text-body-sm text-on-surface-variant text-center">نظم مجموعات الدفع</span>
</button>
</div>
<!-- Quick Actions / Chips -->
<div class="flex gap-sm mb-xl overflow-x-auto pb-2 scrollbar-hide">
<button class="bg-surface-variant text-on-surface-variant px-lg py-sm rounded-full font-arabic-body text-arabic-body whitespace-nowrap border border-outline-variant hover:bg-surface-container-highest transition-colors">
                استيراد صورة الفاتورة
            </button>
<button class="bg-surface-variant text-on-surface-variant px-lg py-sm rounded-full font-arabic-body text-arabic-body whitespace-nowrap border border-outline-variant hover:bg-surface-container-highest transition-colors">
                الإعدادات
            </button>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary h-[56px] rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-sm shadow-md hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="add">add</span>
            إنشاء فاتورة جديدة
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-2 bg-surface-container dark:bg-inverse-surface border-t border-outline-variant dark:border-outline shadow-lg rounded-t-xl">
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-2 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-caps text-label-caps">History</span>
</a>

<span class="material-symbols-outlined mb-1" data-icon="receipt_long" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-caps text-label-caps">Split</span>
</a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-2 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label-caps text-label-caps">Groups</span>
</a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-2 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
