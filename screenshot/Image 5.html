<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SplitEat - Scan Receipt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary-fixed-dim": "#93ccff",
                        "on-background": "#171c1f",

                        "on-tertiary": "#ffffff",

                        "on-primary-fixed": "#001d31",
                        "error": "#ba1a1a",
                        "primary-fixed": "#cce5ff",
                        "secondary-fixed-dim": "#bec6e0",
                        "surface-tint": "#006398",
                        "primary-container": "#007bb9",
                        "surface-bright": "#f6fafe",
                        "on-primary": "#ffffff",
                        "on-surface": "#171c1f",
                        "on-surface-variant": "#3f4850",
                        "secondary": "#565e74",
                        "secondary-container": "#dae2fd",
                        "tertiary": "#894d00",
                        "on-error-container": "#93000a",
                        "surface-container": "#eaeef2",
                        "on-error": "#ffffff",
                        "outline": "#707881",
                        "on-tertiary-container": "#fffbff",
                        "surface-container-lowest": "#ffffff",

                        "on-tertiary-fixed": "#2d1600",
                        "inverse-primary": "#93ccff",
                        "surface-container-highest": "#dfe3e7",
                        "tertiary-fixed-dim": "#ffb875",
                        "outline-variant": "#bfc7d2",
                        "background": "#f6fafe",
                        "surface": "#f6fafe",
                        "surface-variant": "#dfe3e7",
                        "on-secondary-container": "#5c647a",
                        "on-primary-fixed-variant": "#004b73",
                        "on-tertiary-fixed-variant": "#6b3b00",
                        "tertiary-fixed": "#ffdcc0",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#131b2e",
                        "on-secondary-fixed-variant": "#3f465c",
                        "secondary-fixed": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "container-padding": "20px",
                        "sm": "12px",
                        "bento-gap": "12px",
                        "xl": "32px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-lg": ["Public Sans"],
                        "display-lg-mobile": ["Public Sans"],
                        "arabic-body": ["IBM Plex Sans Arabic"],
                        "headline-md": ["Public Sans"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "arabic-body": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .scanning-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(0, 123, 185, 0.8), transparent);
            box-shadow: 0 0 8px rgba(0, 123, 185, 0.5);
            animation: scan 2.5s infinite ease-in-out;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes scan {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }

        .scanning-active .scanning-laser {
            opacity: 1;
        }
        
        .shimmer {
            background: linear-gradient(90deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.2) 50%, 
                rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmerEffect 2s infinite linear;
        }
        
        @keyframes shimmerEffect {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-container-padding py-sm w-full top-0 z-40 sticky">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container-highest">
<span aria-hidden="true" class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background">Scan Receipt</h1>
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center p-2 -mr-2 rounded-full hover:bg-surface-container-highest">
<span aria-hidden="true" class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-padding pb-[100px] pt-sm gap-bento-gap max-w-md mx-auto w-full relative">
<!-- Status Badge -->
<div class="flex justify-center mb-2">
<div class="inline-flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full shadow-sm transition-all duration-300" id="statusBadge">
<span class="material-symbols-outlined text-primary text-[18px] animate-pulse">document_scanner</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Position receipt in frame</span>
</div>
</div>
<!-- Viewfinder / Preview Bento Card -->
<div class="relative bg-surface-container-lowest rounded-[24px] overflow-hidden shadow-[0_4px_12px_rgba(15,23,42,0.04)] border border-outline-variant/30 aspect-[3/4] w-full flex-1 flex flex-col items-center justify-center group" id="viewfinderArea">
<!-- Camera Feed Placeholder -->
<div class="absolute inset-0 bg-surface-dim/20">
<img class="w-full h-full object-cover opacity-60" data-alt="A blurred, slightly desaturated background image simulating a camera viewfinder looking at a wooden dining table with a partially visible white paper receipt. The lighting is soft and natural, typical of a bright modern restaurant environment, creating a clean, trustworthy backdrop for the UI overlay." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcRvHkQm-xb0DMcdWImD43XOmMB66sfsHYHblLqr1SxMXBWcjBnfH64R9jPpZH8SClGQ9Rxgh9uEaGYDT2ZFcAggL85aaUMH0OAWEBb0R2HsrjFzDOY4zrqkuKQVAtEDgmkhlWQTN3-KJsarJh-LQG908hrXh0qAeEvaodAMKrR8JvzYRRTWXTwnvu_yjkReWu1Kc5hfqrWkvLVjPWP9OkJEmTIOydNjcLnFkAdI8LPZMi-gFv2qfT4g"/>
</div>
<!-- Viewfinder Frame Overlays -->
<div class="absolute inset-4 border-2 border-primary/30 rounded-xl pointer-events-none z-10 transition-colors duration-300" id="viewfinderFrame">
<!-- Corner markers -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
</div>
<!-- Scanning Animation Line -->
<div class="scanning-laser"></div>
<!-- Empty State / Instructions Overlay (Fades out when active) -->
<div class="relative z-20 flex flex-col items-center justify-center text-center p-6 bg-surface-container-lowest/80 backdrop-blur-sm rounded-xl m-8" id="instructionOverlay">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[32px]">receipt_long</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-background mb-2">Capture Details</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[200px]">Ensure all text is legible and well-lit for best results.</p>
</div>
</div>
<!-- Action Grid (Bento Style) -->
<div class="grid grid-cols-2 gap-bento-gap mt-2">
<!-- Camera Button -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-[0_4px_12px_rgba(15,23,42,0.04)] border border-outline-variant/30 hover:bg-surface-container-highest transition-colors active:scale-[0.98]" onclick="simulateScan()">
<div class="w-12 h-12 bg-primary/10 text-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Take Photo</span>
</button>
<!-- Gallery Button -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-[0_4px_12px_rgba(15,23,42,0.04)] border border-outline-variant/30 hover:bg-surface-container-highest transition-colors active:scale-[0.98]">
<div class="w-12 h-12 bg-secondary/10 text-secondary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">image</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Gallery</span>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-md border-t border-outline-variant/20 px-container-padding py-4 pb-8 z-50">
<div class="max-w-md mx-auto">
<button class="w-full bg-surface-container-high text-on-surface-variant font-headline-md text-headline-md py-[14px] rounded-xl flex items-center justify-center gap-2 transition-all duration-300 cursor-not-allowed opacity-70" disabled="" id="continueBtn">
<span>Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<script>
        function simulateScan() {
            const viewfinder = document.getElementById('viewfinderArea');
            const statusBadge = document.getElementById('statusBadge');
            const instructions = document.getElementById('instructionOverlay');
            const frame = document.getElementById('viewfinderFrame');
            const continueBtn = document.getElementById('continueBtn');
            const statusText = statusBadge.querySelector('span:last-child');
            const statusIcon = statusBadge.querySelector('span:first-child');
            
            // Start scanning state
            viewfinder.classList.add('scanning-active');
            instructions.style.opacity = '0';
            instructions.style.transition = 'opacity 0.3s';
            
            // Update Status Badge to Reading
            statusBadge.classList.replace('bg-surface-container-high', 'bg-primary-container');
            statusIcon.classList.replace('text-primary', 'text-on-primary-container');
            statusIcon.textContent = 'document_scanner';
            statusText.classList.replace('text-on-surface-variant', 'text-on-primary-container');
            statusText.textContent = 'Reading receipt...';
            
            // Flash frame
            frame.classList.replace('border-primary/30', 'border-primary');
            
            // Simulate processing time
            setTimeout(() => {
                // Success state
                viewfinder.classList.remove('scanning-active');
                frame.classList.replace('border-primary', 'border-[#00945d]'); // A green for success indication within theme bounds would be ideal, using primary variant here for safety
                frame.innerHTML = `
                    <div class="absolute inset-0 bg-primary/10 rounded-xl shimmer"></div>
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg">
                        <span class="material-symbols-outlined text-[32px]">check</span>
                    </div>
                `;
                
                statusBadge.classList.replace('bg-primary-container', 'bg-surface-container-high');
                statusIcon.classList.replace('text-on-primary-container', 'text-primary');
                statusIcon.textContent = 'check_circle';
                statusIcon.classList.remove('animate-pulse');
                statusText.classList.replace('text-on-primary-container', 'text-on-surface-variant');
                statusText.textContent = 'Capture successful';
                
                // Enable Continue Button
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:opacity-90', 'active:scale-[0.98]', 'shadow-md');
                
            }, 2500);
        }
    </script>
</body></html>
