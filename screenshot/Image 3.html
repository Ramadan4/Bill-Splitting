<style>
        body { font-family: 'Inter', sans-serif; }
        .bento-shadow { box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.04); }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col pt-0 pb-32">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-container-padding py-sm w-full top-0 z-40 sticky">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-primary group-active:scale-95 duration-100">restaurant</span>
</button>
<div class="flex items-center gap-2">
<img alt="SplitEat Logo" class="w-8 h-8 rounded-DEFAULT object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwC3EE5Kef4anrdy3DAeLXfPyA2REiw79WqDglwM5jkI-nGWAeVgPNrzp7u7Fmj3gyt-v56prd5ORO7q83LN9gF8kiZ0sDTuVLNzoW8k_mtjjgM3tJSNIE0Ug4CNtL0-dMTG3CMoYRs7axhZ5_ofdtJqLS75liiLsdQ0ZHWlp53vEHX1epSIBFjyFyQIaw0Cf8OkIq8US1U3j8SaUuE3fy8UQvuHVue_a5fyNky-dTDmuiK_oOL1rZyA"/>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">SplitEat</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-95 duration-100">translate</span>
</button>
</header>
<main class="flex-1 flex flex-col px-container-padding gap-bento-gap max-w-lg mx-auto w-full mt-4">
<!-- Hero Section -->
<section class="text-center py-6">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-2">SplitEat</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Fair and social bill splitting</p>
</section>
<!-- Bento Grid -->
<div class="grid grid-cols-2 gap-bento-gap">
<!-- Bill History Tile -->
<button class="bg-surface-container-lowest rounded-xl p-lg bento-shadow flex flex-col items-center justify-center gap-sm aspect-square hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-secondary-container text-4xl" style="font-variation-settings: 'FILL' 1;">history</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Bill History</span>
</button>
<!-- Friend Groups Tile -->
<button class="bg-surface-container-lowest rounded-xl p-lg bento-shadow flex flex-col items-center justify-center gap-sm aspect-square hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Friend Groups</span>
</button>
</div>
<!-- Quick Settings Chips -->
<section class="flex gap-3 justify-center mt-4">
<button class="flex items-center gap-2 bg-surface-container rounded-full px-4 py-2 border border-outline-variant hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm">palette</span>
<span class="font-label-caps text-label-caps">Theme</span>
</button>
<button class="flex items-center gap-2 bg-surface-container rounded-full px-4 py-2 border border-outline-variant hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm">language</span>
<span class="font-label-caps text-label-caps">Language</span>
</button>
</section>
</main>
<!-- Floating Action Button Area / Primary CTA -->
<div class="fixed bottom-24 left-0 w-full px-container-padding z-40 max-w-lg mx-auto left-1/2 -translate-x-1/2">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-lg hover:bg-primary-container active:scale-[0.98] transition-all duration-150">
<span class="material-symbols-outlined">add_circle</span>
            Create New Bill
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-2 bg-surface-container border-t border-outline-variant shadow-lg rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors active:scale-90 duration-150 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">history</span>
<span class="font-label-caps text-label-caps mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 hover:bg-surface-container-highest transition-colors active:scale-90 duration-150 group shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-caps text-label-caps mt-1">Split</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors active:scale-90 duration-150 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">group</span>
<span class="font-label-caps text-label-caps mt-1">Groups</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors active:scale-90 duration-150 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</button>
</nav>
</body></html>
